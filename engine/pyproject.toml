[project]
name = "werkbank-engine"
version = "0.1.0"
description = "Werkbank local engine: runs native tools for the Werkbank UI, bound to 127.0.0.1 only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "pydantic>=2.13.5",
    "yt-dlp[default]>=2026.8.19",
    "pikepdf>=10.13.0",
    "pypdfium2>=5.13.0",
    "pdfplumber>=0.11.10",
    "pyhanko>=0.37.0",
    "img2pdf>=0.6.3",
    "pillow>=12.3.0",
    "reportlab>=5.0.1",
    "openpyxl>=3.1.5",
]

[project.scripts]
werkbank-engine = "werkbank_engine.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.13.1",
    "ruff>=0.16.8",
]
portable = [
    "pefile>=2024.8.26",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["werkbank_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF", "ASYNC", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

name: CI

# Every push and pull request: lint, type checks, unit tests (web + engine), end-to-end acceptance
# tests, and the portable Windows app (built, tested with its own bundled programs, smoke-tested).
# Pushes to main publish the portable app as a GitHub release and deploy the static UI to
# Cloudflare, but only after every check passes.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: '0.12.18'
  DENO_VERSION: '2.9.6'
  WHISPER_CPP_VERSION: 'v1.9.2'

jobs:
  web:
    name: Web (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Tool registry JSON is up to date
        run: npm run gen:check -w packages/shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Cloudflare per-file size limit (25 MiB)
        run: |
          big=$(find apps/web/dist -type f -size +25M)
          if [ -n "$big" ]; then echo "Files over 25 MiB:"; echo "$big"; exit 1; fi

  engine:
    name: Engine (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - run: pipx install "uv==${UV_VERSION}"
      - name: Install FFmpeg, Deno and Tesseract (the tool tests run the real programs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-afr
          npm install -g "deno@${DENO_VERSION}"
      - uses: actions/cache@v4
        id: whisper-cache
        with:
          path: ~/whisper-bin
          key: whisper-cli-${{ env.WHISPER_CPP_VERSION }}-${{ runner.os }}
      - name: Build whisper-cli from the pinned whisper.cpp tag
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build whisper.cpp/build -j4 --target whisper-cli
          mkdir -p ~/whisper-bin && cp whisper.cpp/build/bin/whisper-cli ~/whisper-bin/
      - name: Speech models for the transcription test (tiny, pinned by SHA-256)
        run: |
          echo "$HOME/whisper-bin" >> "$GITHUB_PATH"
          mkdir -p ~/whisper-models && cd ~/whisper-models
          curl -fsSLo ggml-tiny-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-tiny-q5_1.bin
          curl -fsSLo ggml-silero-v6.2.0.bin https://huggingface.co/ggml-org/whisper-vad/resolve/9ffd54a1e1ee413ddf265af9913beaf518d1639b/ggml-silero-v6.2.0.bin
          printf '%s  %s\n' 818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7 ggml-tiny-q5_1.bin \
            2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987 ggml-silero-v6.2.0.bin | sha256sum -c
          echo "WERKBANK_TEST_WHISPER_MODEL=$HOME/whisper-models/ggml-tiny-q5_1.bin" >> "$GITHUB_ENV"
          echo "WERKBANK_TEST_VAD_MODEL=$HOME/whisper-models/ggml-silero-v6.2.0.bin" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: uv run ruff check --config pyproject.toml . ../scripts/portable
      - run: uv run ruff format --check --config pyproject.toml . ../scripts/portable
      - run: uv run pytest

  e2e:
    name: End-to-end (Mode A 🟢, Mode B ⚪)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: pipx install "uv==${UV_VERSION}"
      - name: Install FFmpeg and Deno (required engine dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm install -g "deno@${DENO_VERSION}"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv sync --project engine --frozen
      - run: npm run build
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  portable-windows:
    name: Portable Windows app (build, engine tests, smoke test)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      # A regular CPython for PyInstaller to freeze (uv picks it up from PATH).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pipx install "uv==${{ env.UV_VERSION }}"
      - run: npm ci
      - run: npm run build
      - run: uv sync --project engine --frozen --group portable
      - uses: actions/cache@v4
        with:
          path: build/portable-cache
          key: portable-programs-${{ hashFiles('scripts/portable/programs.json') }}
      - name: Build Werkbank-windows-x64.zip (pinned programs, SHA-256 checked)
        run: uv run --project engine --frozen python scripts/portable/build.py
      - name: Engine test suite on Windows with the bundled FFmpeg, Deno, whisper.cpp and Tesseract
        shell: powershell
        working-directory: engine
        run: |
          $ErrorActionPreference = 'Continue'
          $bin = "$env:GITHUB_WORKSPACE\build\portable\dist\Werkbank\bin"
          $env:Path = "$bin;$bin\whisper;$bin\tesseract;$env:Path"
          $env:WERKBANK_TEST_WHISPER_MODEL = "$bin\models\ggml-small-q5_1.bin"
          $env:WERKBANK_TEST_VAD_MODEL = "$bin\models\ggml-silero-v6.2.0.bin"
          uv run --frozen pytest -q
          exit $LASTEXITCODE
      - name: Smoke test the unpacked app (nothing else on PATH), incl. transcription, OCR and the yt-dlp self-update
        run: uv run --project engine --frozen python scripts/portable/smoke.py build/portable/dist/Werkbank --update-ytdlp
      - uses: actions/upload-artifact@v4
        with:
          name: Werkbank-windows-x64
          path: build/portable/Werkbank-windows-x64.zip
          compression-level: 0
          retention-days: 30

  release:
    name: Publish the portable app (GitHub release)
    needs: [web, engine, e2e, portable-windows]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-portable
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Werkbank-windows-x64
      - name: Create release build-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" Werkbank-windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Werkbank portable (build ${GITHUB_RUN_NUMBER})" \
            --notes "Portable Windows app built from ${GITHUB_SHA}. Extract the zip and double-click Werkbank.exe; nothing is installed and no administrator rights are needed. SHA-256: $(sha256sum Werkbank-windows-x64.zip | cut -d' ' -f1)"

  deploy:
    name: Deploy to Cloudflare
    needs: [web, engine, e2e, portable-windows, release]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://localutilities.cobus-w.workers.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check Cloudflare token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (see README, 'Hosted UI')."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - name: Deploy with the repo-pinned wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the live site serves this commit
        run: |
          for i in $(seq 1 12); do
            live=$(curl -fsS https://localutilities.cobus-w.workers.dev/version.json | jq -r .commit || true)
            echo "live=$live expected=$GITHUB_SHA"
            [ "$live" = "$GITHUB_SHA" ] && exit 0
            sleep 5
          done
          echo "::error::Live site is not serving $GITHUB_SHA"; exit 1

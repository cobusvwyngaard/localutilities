name: CI

# Every push and pull request: lint, type checks, unit tests (web + engine), end-to-end acceptance
# tests, and the portable Windows app (built, tested with its own bundled programs, smoke-tested).
# Pushes to main publish the portable app as a GitHub release and deploy the static UI to
# Cloudflare, but only after every check passes.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: '0.12.18'
  DENO_VERSION: '2.9.6'

jobs:
  web:
    name: Web (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Tool registry JSON is up to date
        run: npm run gen:check -w packages/shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Cloudflare per-file size limit (25 MiB)
        run: |
          big=$(find apps/web/dist -type f -size +25M)
          if [ -n "$big" ]; then echo "Files over 25 MiB:"; echo "$big"; exit 1; fi

  engine:
    name: Engine (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - run: pipx install "uv==${UV_VERSION}"
      - name: Install FFmpeg and Deno (the tool tests run the real programs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm install -g "deno@${DENO_VERSION}"
      - run: uv sync --frozen
      - run: uv run ruff check --config pyproject.toml . ../scripts/portable
      - run: uv run ruff format --check --config pyproject.toml . ../scripts/portable
      - run: uv run pytest

  e2e:
    name: End-to-end (Mode A 🟢, Mode B ⚪)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: pipx install "uv==${UV_VERSION}"
      - name: Install FFmpeg and Deno (required engine dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm install -g "deno@${DENO_VERSION}"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv sync --project engine --frozen
      - run: npm run build
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  portable-windows:
    name: Portable Windows app (build, engine tests, smoke test)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      # A regular CPython for PyInstaller to freeze (uv picks it up from PATH).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pipx install "uv==${{ env.UV_VERSION }}"
      - run: npm ci
      - run: npm run build
      - run: uv sync --project engine --frozen --group portable
      - name: Build Werkbank-windows-x64.zip (pinned programs, SHA-256 checked)
        run: uv run --project engine --frozen python scripts/portable/build.py
      - name: Engine test suite on Windows with the bundled FFmpeg and Deno
        shell: powershell
        working-directory: engine
        run: |
          $ErrorActionPreference = 'Continue'
          $env:Path = "$env:GITHUB_WORKSPACE\build\portable\dist\Werkbank\bin;$env:Path"
          uv run --frozen pytest -q
          exit $LASTEXITCODE
      - name: Smoke test the unpacked app (nothing else on PATH) and the yt-dlp self-update
        run: uv run --project engine --frozen python scripts/portable/smoke.py build/portable/dist/Werkbank --update-ytdlp
      - uses: actions/upload-artifact@v4
        with:
          name: Werkbank-windows-x64
          path: build/portable/Werkbank-windows-x64.zip
          compression-level: 0
          retention-days: 30

  release:
    name: Publish the portable app (GitHub release)
    needs: [web, engine, e2e, portable-windows]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-portable
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Werkbank-windows-x64
      - name: Create release build-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" Werkbank-windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Werkbank portable (build ${GITHUB_RUN_NUMBER})" \
            --notes "Portable Windows app built from ${GITHUB_SHA}. Extract the zip and double-click Werkbank.exe; nothing is installed and no administrator rights are needed. SHA-256: $(sha256sum Werkbank-windows-x64.zip | cut -d' ' -f1)"

  deploy:
    name: Deploy to Cloudflare
    needs: [web, engine, e2e, portable-windows, release]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://localutilities.cobus-w.workers.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check Cloudflare token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (see README, 'Hosted UI')."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - name: Deploy with the repo-pinned wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the live site serves this commit
        run: |
          for i in $(seq 1 12); do
            live=$(curl -fsS https://localutilities.cobus-w.workers.dev/version.json | jq -r .commit || true)
            echo "live=$live expected=$GITHUB_SHA"
            [ "$live" = "$GITHUB_SHA" ] && exit 0
            sleep 5
          done
          echo "::error::Live site is not serving $GITHUB_SHA"; exit 1

name: Deploy

# Deploys the static UI to Cloudflare (Workers Static Assets, see wrangler.jsonc).
# Only `main` deploys; other branches never touch Cloudflare.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://localutilities.cobus-w.workers.dev
    steps:
      - name: Check Cloudflare token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (see README, 'Hosted UI')."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - name: Deploy with the repo-pinned wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the live site serves this commit
        run: |
          for i in $(seq 1 12); do
            live=$(curl -fsS https://localutilities.cobus-w.workers.dev/version.json | jq -r .commit || true)
            echo "live=$live expected=$GITHUB_SHA"
            [ "$live" = "$GITHUB_SHA" ] && exit 0
            sleep 5
          done
          echo "::error::Live site is not serving $GITHUB_SHA"; exit 1
